\* The example of a failing model: the code as it is, with a 2-value counter instead of 16 bits.  A popper stalled
\* between its head load and its CAS is fooled once the head returns to the same (pointer, counter) word: ABA.
\* Expected: Safety violated (this is what the counter width guards against).
