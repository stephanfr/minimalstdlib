\* Same-CPU interrupt handlers: reader 3 interrupts writer 1, and writer 2 interrupts reader 3 (nested).  While a
\* handler is inside an operation the thread it interrupted cannot run.  Expected: no error; every process finishes.
CONSTANTS
    NumSlots = 2
    WordCount = 2
    Writers = {1, 2}
    Readers = {3}
    StoresPer = 3
    ReadsPer = 2
    SeqMod = 64
    CheckPublishedSeq = TRUE
    FairProcs = {1, 2, 3}
    IrqPairs <- IrqNested
SPECIFICATION LiveSpec
INVARIANT Safety
PROPERTY FairDone
