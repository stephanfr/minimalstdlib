\* seq_ wraps after two rewrites of a slot (SeqMod = 4; 2^32 in C++).  A reader stalled across two rewrites of
\* its slot sees the published seq again and accepts a later, different value.  Expected: an assertion fails --
\* this is the documented assumption that a load never stalls across 2^31 rewrites of one slot.
CONSTANTS
    NumSlots = 2
    WordCount = 2
    Writers = {1}
    Readers = {3}
    StoresPer = 4
    ReadsPer = 1
    SeqMod = 4
    CheckPublishedSeq = TRUE
    FairProcs = {1, 3}
    IrqPairs = {}
SPECIFICATION LiveSpec
INVARIANT Safety
