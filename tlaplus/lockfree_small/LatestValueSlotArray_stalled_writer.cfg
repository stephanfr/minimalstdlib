\* Lock-freedom: writer 2 is not fair, so it may stop forever at any step -- including while it holds
\* writer_busy_ mid-store.  Writer 1 (whose stores then drop) and the reader must still finish.  Expected: no error.
CONSTANTS
    NumSlots = 2
    WordCount = 2
    Writers = {1, 2}
    Readers = {3}
    StoresPer = 3
    ReadsPer = 2
    SeqMod = 64
    CheckPublishedSeq = TRUE
    FairProcs = {1, 3}
    IrqPairs = {}
SPECIFICATION LiveSpec
INVARIANT Safety
PROPERTY FairDone
