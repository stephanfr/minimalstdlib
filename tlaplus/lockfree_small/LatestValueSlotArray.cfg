\* 2 writers x 3 stores, 1 reader x 2 loads, 2 slots, 2-word payload.  One reader suffices: readers write nothing
\* shared, so a second one only adds interleavings of independent loads.  Expected: no error; every process finishes.
CONSTANTS
    NumSlots = 2
    WordCount = 2
    Writers = {1, 2}
    Readers = {3}
    StoresPer = 3
    ReadsPer = 2
    SeqMod = 64
    CheckPublishedSeq = TRUE
    FairProcs = {1, 2, 3}
    IrqPairs = {}
SPECIFICATION LiveSpec
INVARIANT Safety
PROPERTY FairDone
