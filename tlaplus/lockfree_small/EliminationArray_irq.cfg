\* Thread 2 is an interrupt handler on thread 1's CPU; thread 3 runs on another CPU.
\* Expected: pass. A handler only spins after its own CAS installed WAITING_GET/WAITING_PUT, and the thread it
\* interrupted was frozen before that install, so it can never be the partner the handler is waiting on.
CONSTANTS
    Threads = {1, 2, 3}
    OpsPer = 2
    SameCpuIrq = TRUE
SPECIFICATION Spec
INVARIANT Safety
PROPERTY Termination
