\* The first version of load(): it accepted any even seq_ that was unchanged across the copy, without
\* checking it against the seq published in current_.  A reader lapped while the writer is between its even
\* seq_ store and its current_ store returns that unpublished value; a later read then returns the older
\* published one.  Expected: the linearisability assertion fails.
CONSTANTS
    NumSlots = 2
    WordCount = 1
    Writers = {1}
    Readers = {3}
    StoresPer = 3
    ReadsPer = 1
    SeqMod = 64
    CheckPublishedSeq = FALSE
    FairProcs = {1, 3}
    IrqPairs = {}
SPECIFICATION LiveSpec
INVARIANT Safety
