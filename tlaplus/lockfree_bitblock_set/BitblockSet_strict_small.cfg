\* TLC Configuration for BitblockSet - Strict check, exhaustive
\* 2 words x 2 bits, 2 CPUs each with one interrupt level, one operation per
\* context, operations of up to 3 bits (so every multi-word path, including
\* the undo steps, can be interrupted).  Checks StrictSafety.
\* Expected: no error.

CONSTANTS
    BPW = 2
    NW = 2
    NumCPUs = 2
    MaxInterruptDepth = 1
    MaxBits = 3
    MaxOps = 1

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT StrictSafety
