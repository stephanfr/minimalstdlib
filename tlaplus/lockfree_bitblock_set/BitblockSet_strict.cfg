\* TLC Configuration for BitblockSet - Strict orphan check
\* Same parameters as main, but checks StrictSafety, which adds
\* NoOrphanBits and TentativeSafe: every set bit is owned, or held
\* tentatively by a multi-word acquire until it is confirmed or undone.
\* Expected: no error.  (It failed before acquire_multi_word rolled back
\* the bits it set on a failed first or last word.)

CONSTANTS
    BPW = 3
    NW = 2
    NumCPUs = 2
    MaxInterruptDepth = 1
    MaxBits = 3
    MaxOps = 2

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT StrictSafety
