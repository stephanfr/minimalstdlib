\* 2 CPUs (2 + 1 ops), weak fairness. Expected: Safety holds and every process terminates (no livelock).
CONSTANTS
    NumCPUs = 2
    UseInterrupts = FALSE
    ArenaUnits = 12
    RecordsPerManager = 2
    NumManagers = 2
    Sizes = {2, 3}
    Threshold = 1
    OpsPerThread <- Ops_2_1
    MaxIrqOps = 0
    defaultInitValue = 0
    InitialBacklinks <- CleanArena
SPECIFICATION SpecIFair
INVARIANT Safety
PROPERTY Termination
