\* 1 CPU with an interrupt handler. Expected: no error, no deadlock.
\* One CPU with an interrupt handler that allocates/frees while the CPU is outside an interrupt_guard.
CONSTANTS
    NumCPUs = 1
    UseInterrupts = TRUE
    ArenaUnits = 12
    RecordsPerManager = 2
    NumManagers = 2
    Sizes = {2, 3}
    Threshold = 1
    OpsPerThread <- Ops_3
    MaxIrqOps = 2
    defaultInitValue = 0
    InitialBacklinks <- CleanArena
SPECIFICATION SpecI
INVARIANT Safety
