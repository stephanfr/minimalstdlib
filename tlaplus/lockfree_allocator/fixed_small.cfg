\* All fixes applied (N3/N4 packed frontier, serialised reclaim, N5, N6). 2 CPUs, 2 ops each. Expected: no error.
CONSTANTS
    NumCPUs = 2
    UseInterrupts = FALSE
    ArenaUnits = 12
    RecordsPerManager = 2
    NumManagers = 2
    Sizes = {2, 3}
    Threshold = 1
    OpsPerThread <- Ops_2_2
    MaxIrqOps = 0
    FrontierMode = "packed"
    SerializeReclaim = TRUE
    PendingCountFirst = TRUE
    GuardTrim = TRUE
    FixedBoundary = TRUE
    defaultInitValue = 0
    InitialBacklinks <- CleanArena
SPECIFICATION SpecI
INVARIANT Safety
