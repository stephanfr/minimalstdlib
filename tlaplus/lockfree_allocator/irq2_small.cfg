\* As irq2.cfg (2 CPUs, each with an interrupt handler) with one block size and a smaller arena, so the run is
\* exhaustive. Expected: no error, no deadlock.
CONSTANTS
    NumCPUs = 2
    UseInterrupts = TRUE
    ArenaUnits = 10
    RecordsPerManager = 2
    NumManagers = 2
    Sizes = {2}
    Threshold = 1
    OpsPerThread <- Ops_1_1
    MaxIrqOps = 1
    defaultInitValue = 0
    InitialBacklinks <- CleanArena
SPECIFICATION SpecI
INVARIANT Safety
