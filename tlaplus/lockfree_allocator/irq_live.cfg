\* 1 CPU (3 ops) + interrupt handler (2 ops), weak fairness. Expected: Safety holds and every process terminates.
\* One CPU with an interrupt handler that allocates/frees while the CPU is outside an interrupt_guard.
CONSTANTS
    NumCPUs = 1
    UseInterrupts = TRUE
    ArenaUnits = 12
    RecordsPerManager = 2
    NumManagers = 2
    Sizes = {2, 3}
    Threshold = 1
    OpsPerThread <- Ops_3
    MaxIrqOps = 2
    defaultInitValue = 0
    InitialBacklinks <- CleanArena
SPECIFICATION SpecIFair
INVARIANT Safety
PROPERTY Termination
