\* All fixes; maintenance windows open at 2 pending entries and process batches of 2. Expected: no error.
CONSTANTS
    NumCPUs = 2
    UseInterrupts = FALSE
    ArenaUnits = 12
    RecordsPerManager = 2
    NumManagers = 2
    Sizes = {2, 3}
    Threshold = 2
    OpsPerThread <- Ops_2_2
    MaxIrqOps = 0
    FrontierMode = "packed"
    SerializeReclaim = TRUE
    PendingCountFirst = TRUE
    GuardTrim = TRUE
    FixedBoundary = TRUE
    defaultInitValue = 0
    InitialBacklinks <- CleanArena
SPECIFICATION SpecI
INVARIANT Safety
