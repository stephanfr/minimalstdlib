\* remove() before the retarget fix: the remover's re-walk landed on this node (a re-insert) and marks only its
\* level 0.  Expected: EventuallyRetired violated - the upper links are never tombstoned, so they are never
\* unlinked, the count never drains, and the node is never retired (it and its slot leak).
CONSTANTS
    Height = 3
    NumHelpers = 2
    MaxCasFailures = 1
    DrainGate = TRUE
    RetargetBug = TRUE
SPECIFICATION Spec
INVARIANT Safety
PROPERTY Termination EventuallyRetired
