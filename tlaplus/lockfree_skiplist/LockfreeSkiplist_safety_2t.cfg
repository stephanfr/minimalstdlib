\* Two threads on two CPUs, two keys: safety and deadlock with contention (a CAS fails only after another
\*   thread changed a link).  Retries, epochs and nesting are kept small so the run is exhaustive.

CONSTANTS
    Keys = {1, 2}
    Threads = {1, 2}
    Cpus = {1, 2}
    MaxLevels = 2
    MaxRetryTicks = 1
    MaxEpoch = 3
    EpochLag = 2
    MaxReadDepth = 1

SPECIFICATION Spec

CHECK_DEADLOCK TRUE

INVARIANT
    TypeOK
    StateConsistency
    FullyUnlinkedSubsetRetired
    InterruptReentrancySafe
    RemoveDeletesAtMostOne
