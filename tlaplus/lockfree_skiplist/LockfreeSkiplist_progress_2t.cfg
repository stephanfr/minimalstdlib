\* Two threads on two CPUs, one key, weak fairness: lock-freedom (some operation keeps completing).
\*   ActiveOpsEventuallyFinish (every operation finishes) is not checked here: a remove() may restart for as
\*   long as the other thread keeps completing operations, which lock-freedom allows.

CONSTANTS
    Keys = {1}
    Threads = {1, 2}
    Cpus = {1, 2}
    MaxLevels = 2
    MaxRetryTicks = 2
    MaxEpoch = 4
    EpochLag = 2
    MaxReadDepth = 2

SPECIFICATION SpecFair

CHECK_DEADLOCK TRUE

INVARIANT
    TypeOK
    StateConsistency
    FullyUnlinkedSubsetRetired
    InterruptReentrancySafe
    RemoveDeletesAtMostOne

PROPERTY
    GlobalProgress
